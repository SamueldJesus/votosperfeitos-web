name = "votosperfeitos-web-staging"
main = "src/worker/index.ts"
compatibility_date = "2026-09-15"
workers_dev = true

[vars]
EMAIL_FROM = "VotosPerfeitos <oi@avancoai.com.br>"
META_PIXEL_ID = ""
PAGARME_BASE_URL = "https://sdx-api.pagar.me/core/v5"

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "ORDERS"
database_name = "votosperfeitos-orders-staging"
database_id = "0b333911-4322-4dc8-a856-e14a9f450679"

[[r2_buckets]]
binding = "VOW_FILES"
bucket_name = "votosperfeitos-files-staging"

[[queues.producers]]
binding = "VOW_JOBS"
queue = "votosperfeitos-vow-jobs-staging"

[[queues.consumers]]
queue = "votosperfeitos-vow-jobs-staging"
